# Nginx site for the CStyle API.
# Copy to /etc/nginx/sites-available/cstyle-api, replace api.cstylecollective.com with
# your API domain, enable it, then run certbot to add HTTPS (see DEPLOY.md).

server {
    listen 80;
    listen [::]:80;
    server_name api.cstylecollective.com;

    # Product images (10 x 5 MB per request) and HR spreadsheets.
    client_max_body_size 60M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
