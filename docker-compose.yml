# CStyle API for a single server. The database is MongoDB Atlas (MONGODB_URI in .env).
#   docker compose up -d --build
# The API listens on 127.0.0.1:5000 only; Nginx on the host serves it publicly
# over HTTPS (see deploy/nginx-api.conf).

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      UPLOAD_DIR: /app/uploads
      HR_FILES_DIR: /app/private_files/hr
    ports:
      - "127.0.0.1:5000:5000"
    # Images and HR files live in these folders next to this file, so they
    # survive rebuilds and can be copied with WinSCP. Owned by uid 1000 (node).
    volumes:
      - ./uploads:/app/uploads
      - ./private_files:/app/private_files
